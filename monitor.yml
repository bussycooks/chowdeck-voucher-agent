name: Chowdeck Voucher Monitor

on:
  schedule:
    # Run every hour during monitoring hours (6 PM - 11 PM Lagos time)
    # Convert to UTC: 5 PM - 10 PM UTC
    - cron: '0 17-22 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (no real API calls)'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Run voucher monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_TIMEZONE: ${{ secrets.MONITOR_TIMEZONE }}
          MONITOR_START: ${{ secrets.MONITOR_START }}
          MONITOR_END: ${{ secrets.MONITOR_END }}
          MONITOR_INTERVAL_SECONDS: ${{ secrets.MONITOR_INTERVAL_SECONDS }}
          APP_MODE: production
          LOG_LEVEL: INFO
        run: |
          timeout 300 python -m app.main || true
      
      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: chowdeck-database
          path: chowdeck_monitor.db
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H 'Content-Type: application/json' \
            -d '{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"⚠️ Chowdeck Monitor GitHub Action failed. Check logs.\"}' || true

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
